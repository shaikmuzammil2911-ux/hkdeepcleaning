<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#996E1D" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#147271" />
      <stop offset="100%" stop-color="#073332" />
    </linearGradient>
    <linearGradient id="greenLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Badge -->
  <g transform="translate(10, 5)">
    <!-- Outer Gold Ring -->
    <circle cx="55" cy="55" r="50" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldShadow)" />
    <circle cx="55" cy="55" r="44" fill="#FAFCFB" stroke="#E2D099" stroke-width="1.5" stroke-dasharray="3,2" />
    
    <!-- Decorative Leaves on Ring -->
    <path d="M 30 85 C 38 88, 48 94, 55 96 C 62 94, 72 88, 80 85 C 72 82, 62 86, 55 88 C 48 86, 38 82, 30 85 Z" fill="url(#greenLeaf)" />
    <path d="M 40 90 C 47 98, 55 102, 55 102 C 55 102, 63 98, 70 90 C 62 93, 55 95, 55 95 C 55 95, 48 93, 40 90 Z" fill="url(#greenLeaf)" />

    <!-- Sparkle Stars -->
    <path d="M 25 35 Q 28 35 28 32 Q 28 35 31 35 Q 28 35 28 38 Q 28 35 25 35 Z" fill="#D4AF37" />
    <path d="M 82 32 Q 85 32 85 29 Q 85 32 88 32 Q 85 32 85 35 Q 85 32 82 32 Z" fill="#D4AF37" />
    <path d="M 55 18 Q 57 18 57 15 Q 57 18 59 18 Q 57 18 57 21 Q 57 18 55 18 Z" fill="#D4AF37" />

    <!-- HK Monogram Stylized -->
    <g transform="translate(26, 22) scale(0.9)">
      <!-- Letter H -->
      <path d="M 10 12 L 17 12 L 17 48 L 10 48 Z" fill="url(#tealGrad)" />
      <path d="M 27 12 L 34 12 L 34 48 L 27 48 Z" fill="url(#tealGrad)" />
      <path d="M 17 27 L 27 27 L 27 33 L 17 33 Z" fill="url(#goldGrad)" />
      
      <!-- Letter K overlay -->
      <path d="M 38 12 L 45 12 L 45 48 L 38 48 Z" fill="url(#goldGrad)" />
      <path d="M 45 30 L 59 12 L 67 12 L 49 34 L 68 48 L 59 48 L 45 37 Z" fill="url(#goldGrad)" />
      
      <!-- Crown / Shine element above H and K -->
      <path d="M 25 8 Q 38 2 51 8 Q 38 12 25 8 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Mini banner under monogram -->
    <text x="55" y="77" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#0D5C5B" text-anchor="middle" letter-spacing="1.5">HARI KRISHNA</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 18)">
    <!-- Main Brand Name -->
    <text x="0" y="42" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0D5C5B">Hari</tspan><tspan fill="#C89B3C">Krishna</tspan>
    </text>

    <!-- Subtitle with side lines & leaves -->
    <g transform="translate(0, 56)">
      <!-- Left line -->
      <line x1="0" y1="4" x2="16" y2="4" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round" />
      <!-- Leaf icon left -->
      <path d="M 20 4 C 23 1, 26 2, 28 4 C 26 6, 23 7, 20 4 Z" fill="#16A34A" />
      
      <!-- Text -->
      <text x="36" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0A4847" letter-spacing="2.5">DEEP CLEANING SERVICES</text>
      
      <!-- Leaf icon right -->
      <path d="M 226 4 C 229 1, 232 2, 234 4 C 232 6, 229 7, 226 4 Z" fill="#16A34A" />
      <!-- Right line -->
      <line x1="238" y1="4" x2="254" y2="4" stroke="#C89B3C" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Tagline -->
    <text x="2" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#64748B" letter-spacing="0.5">
      <tspan fill="#16A34A">A Cleaner Space</tspan>
      <tspan fill="#C89B3C"> • </tspan>
      <tspan fill="#0D5C5B">A Happier You</tspan>
    </text>
  </g>
</svg>
